name: Build

# Every push: test the harness, and build the app. A push to main also publishes it as a GitHub
# release, which is what install.sh and the app's updater download.
on:
  push:
  workflow_dispatch:

# Read-only by default; only the job that publishes the release gets to write.
permissions:
  contents: read

# A newer push to the same branch replaces a run still going.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The harness (notation, gate, state, storage, the updater's logic), on Linux (cheap and quick).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      - run: swift test
        working-directory: Harness

  # Only once the Linux tests pass: a release never carries code that fails them.
  build:
    needs: test
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Test the harness
        run: swift test
        working-directory: Harness
      - name: Build the app
        # Values from GitHub go in through the environment, never pasted into the script (a
        # branch name is anyone's text).
        env:
          RUN_NUMBER: ${{ github.run_number }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="0.1.$RUN_NUMBER"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          VERSION="$VERSION" BRANCH="$REF_NAME" scripts/build-app.sh
      - name: Open the app and check it runs
        run: scripts/smoke-test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Mindmap
          path: App/build/Mindmap.zip
      - name: Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        # A re-run keeps its run number, so the release may already be there: replace its zip.
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" App/build/Mindmap.zip --clobber
          else
            gh release create "v$VERSION" App/build/Mindmap.zip --target "$GITHUB_SHA" \
              --title "Mindmap $VERSION" --notes "$(git log -1 --format=%B)"
          fi
